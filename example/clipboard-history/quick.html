<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>剪贴板</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    html, body { overflow: hidden; background: transparent; }
    .quick { display: flex; flex-direction: column; height: 100vh; background: var(--bg); position: relative; }
    .qbar {
      display: flex; align-items: center; gap: 8px; padding: 8px;
      background: var(--panel); border-bottom: 1px solid var(--border);
      -webkit-user-select: none; user-select: none;
    }
    .drag {
      flex: 1; font-size: 13px; color: var(--text-dim); cursor: grab;
      -webkit-app-region: drag;
    }
    .close-btn {
      border: none; background: transparent; font-size: 16px; color: var(--text-dim); cursor: pointer; line-height:1;
    }
    .close-btn:hover { color: var(--danger); }
    .qsearch {
      width: 100%; padding: 8px 12px; border: none; border-bottom: 1px solid var(--border);
      outline: none; background: var(--panel); font-size: 13px;
    }
    .qlist { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .qi {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    }
    .qi:hover { border-color: var(--accent); }
    .qi .icon { font-size: 16px; flex: none; }
    .qi .content { flex: 1; min-width: 0; }
    .qi .text { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qi .img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); flex: none; }
    .qi .del {
      flex: none; border: none; background: transparent; cursor: pointer;
      font-size: 14px; color: var(--text-dim); line-height: 1; opacity: 0; padding: 2px 4px;
    }
    .qi:hover .del { opacity: 1; }
    .qi .del:hover { color: var(--danger); }
    .qempty { padding: 30px 10px; text-align: center; color: var(--text-dim); font-size: 13px; }
    .qfoot {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; background: var(--panel); border-top: 1px solid var(--border);
    }
    .qfoot .cnt { font-size: 11px; color: var(--text-dim); }
    .qclear { border: none; background: transparent; cursor: pointer; font-size: 12px; color: var(--danger); padding: 4px 6px; }
    .qconfirm {
      position: absolute; inset: 0; display: none; z-index: 10;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }
    .qc-body {
      width: 240px; padding: 16px; border-radius: 10px;
      background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .qc-title { font-size: 14px; margin-bottom: 14px; text-align: center; }
    .qc-actions { display: flex; gap: 10px; }
    .qc-actions button {
      flex: 1; padding: 8px 0; border-radius: 7px; cursor: pointer;
      font-size: 13px; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    }
    .qc-cancel:hover { border-color: var(--text-dim); }
    .qc-ok { color: var(--danger) !important; border-color: var(--danger) !important; }
  </style>
</head>
<body>
  <div class="quick">
    <div class="qbar">
      <span class="drag" data-tauri-drag-region>📋 剪贴板历史</span>
      <button class="close-btn" id="closeBtn" title="隐藏 (Esc)">×</button>
    </div>
    <input id="q" class="qsearch" placeholder="搜索…（回车关闭，点击即复制）" autofocus />
    <div id="ql" class="qlist"></div>
    <div class="qfoot">
      <span class="cnt" id="qcnt"></span>
      <button class="qclear" id="qClear">清空</button>
    </div>

    <!-- 面板内确认框（不依赖原生 confirm，避免被挡住） -->
    <div class="qconfirm" id="qconfirm">
      <div class="qc-body">
        <div class="qc-title">确定清空全部历史？</div>
        <div class="qc-actions">
          <button class="qc-cancel" id="qcCancel">取消</button>
          <button class="qc-ok" id="qcOk">确定</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/quick.js"></script>
</body>
</html>
