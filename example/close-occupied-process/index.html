<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关闭占用端口/进程的应用</title>
    <style>
      /* ============ 基础与主题 ============ */
      :root {
        --bg: #f1f5f9;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-dim: #64748b;
        --danger: #dc2626;
        --danger-dark: #b91c1c;
        --danger-bg: #fef2f2;
        --green: #16a34a;
        --green-bg: #f0fdf4;
        --amber: #d97706;
        --amber-bg: #fffbeb;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .hidden {
        display: none !important;
      }

      .app {
        max-width: 560px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }

      /* ============ 顶部标题 ============ */
      .app-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }

      .logo {
        flex-shrink: 0;
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(127, 29, 29, 0.25);
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
      }

      .subtitle {
        margin: 3px 0 0;
        font-size: 13px;
        color: var(--text-dim);
      }

      /* ============ 卡片 ============ */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      }

      .card + .card {
        margin-top: 16px;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .card-head h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }

      /* ============ 模式切换（端口 / PID） ============ */
      .mode-switch {
        display: inline-flex;
        background: #e2e8f0;
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
        margin-bottom: 14px;
      }

      .mode-switch button {
        border: none;
        background: transparent;
        padding: 6px 18px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--text-dim);
        cursor: pointer;
        font-family: inherit;
      }

      .mode-switch button.active {
        background: #fff;
        color: var(--danger);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
      }

      /* ============ 输入区 ============ */
      .input-row {
        display: flex;
        gap: 10px;
      }

      .input-row input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        background: #fff;
        color: var(--text);
      }

      .input-row input:focus {
        outline: none;
        border-color: var(--danger);
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
      }

      .btn-kill {
        flex-shrink: 0;
        background: var(--danger);
        border: none;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }

      .btn-kill:hover:not(:disabled) {
        background: var(--danger-dark);
      }

      .btn-kill:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .hint {
        margin: 12px 0 0;
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.6;
      }

      .err {
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--danger);
        word-break: break-all;
      }

      /* ============ 结果区 ============ */
      .badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        padding: 3px 12px;
        border-radius: 999px;
        margin-bottom: 10px;
      }

      .badge.success {
        background: var(--green-bg);
        color: var(--green);
      }

      .badge.error {
        background: var(--danger-bg);
        color: var(--danger);
      }

      .badge.warn {
        background: var(--amber-bg);
        color: var(--amber);
      }

      .result-msg {
        font-size: 14px;
        line-height: 1.7;
        word-break: break-all;
      }

      .result-detail {
        margin: 8px 0 0;
        padding: 10px 12px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        font-family: Consolas, Menlo, monospace;
        color: var(--text-dim);
        line-height: 1.8;
        word-break: break-all;
      }

      /* ============ 操作记录 ============ */
      .log {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 260px;
        overflow-y: auto;
      }

      .log li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 2px;
        font-size: 13px;
        border-bottom: 1px solid #f1f5f9;
        line-height: 1.5;
        word-break: break-all;
      }

      .log li:last-child {
        border-bottom: none;
      }

      .log .log-time {
        flex-shrink: 0;
        font-size: 11px;
        color: var(--text-dim);
        font-family: Consolas, Menlo, monospace;
        margin-top: 2px;
      }

      .log .log-mark {
        flex-shrink: 0;
        font-weight: 700;
      }

      .log .log-mark.ok {
        color: var(--green);
      }

      .log .log-mark.fail {
        color: var(--danger);
      }

      .empty {
        color: var(--text-dim);
        font-size: 13px;
        padding: 10px 4px;
        text-align: center;
      }

      .mini {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-dim);
        border-radius: 6px;
        font-size: 12px;
        padding: 3px 10px;
        cursor: pointer;
        font-family: inherit;
      }

      .mini:hover {
        color: var(--danger);
        border-color: var(--danger);
      }

      /* ============ 页脚 / 提示 ============ */
      .footnote {
        text-align: center;
        font-size: 11px;
        color: var(--text-dim);
        margin: 18px 0 0;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        background: #0f172a;
        color: #fff;
        font-size: 13px;
        padding: 10px 18px;
        border-radius: 999px;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.25);
        max-width: min(92vw, 480px);
        z-index: 50;
      }

      .toast.error {
        background: var(--danger);
      }

      /* ============ 窄屏适配 ============ */
      @media (max-width: 430px) {
        .app {
          padding: 18px 12px 32px;
        }

        .card {
          padding: 15px;
        }

        .input-row {
          flex-direction: column;
        }

        .btn-kill {
          width: 100%;
        }

        .mode-switch {
          width: 100%;
        }

        .mode-switch button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="logo" aria-hidden="true">
          <!-- 停止/关闭图标 -->
          <svg viewBox="0 0 24 24" width="24" height="24">
            <circle cx="12" cy="12" r="10" fill="none" stroke="#fca5a5" stroke-width="2.5" />
            <rect x="7.5" y="7.5" width="9" height="9" rx="2" fill="#fecaca" />
          </svg>
        </div>
        <div>
          <h1>关闭占用端口/进程的应用</h1>
          <p class="subtitle">输入端口号或 PID，反查占用进程并强制关闭（Windows）</p>
        </div>
      </header>

      <!-- ① 输入区：端口 / PID 二选一 -->
      <section class="card">
        <div class="mode-switch" role="group" aria-label="输入类型">
          <button type="button" data-mode="port" class="active">端口号</button>
          <button type="button" data-mode="pid">PID</button>
        </div>

        <div class="input-row">
          <input
            type="number"
            id="value"
            placeholder="例如 8080"
            min="1"
            autofocus
            spellcheck="false"
          />
          <button type="button" id="btn-kill" class="btn-kill">立即关闭</button>
        </div>

        <p class="hint" id="hint">
          输入被占用的端口号，将反查占用该端口的进程并强制关闭（含其子进程树）。
        </p>
        <p class="err hidden" id="err"></p>
      </section>

      <!-- ② 结果区：成功 / 失败 明确反馈 -->
      <section id="result" class="card hidden" aria-live="polite">
        <span id="result-badge" class="badge"></span>
        <div id="result-msg" class="result-msg"></div>
        <pre id="result-detail" class="result-detail hidden"></pre>
      </section>

      <!-- ③ 本次操作记录 -->
      <section class="card">
        <div class="card-head">
          <h2>本次操作记录</h2>
          <button type="button" id="btn-clear" class="mini">清空</button>
        </div>
        <div id="log-empty" class="empty">暂无操作记录</div>
        <ul id="log" class="log hidden"></ul>
      </section>

      <p class="footnote">关闭操作不可撤销；终止系统/受保护进程需要管理员权限。</p>
    </main>

    <div id="toast" class="toast hidden" aria-live="polite"></div>

    <script>
      // =====================================================================
      // 前端逻辑（原生 JS）
      //
      // 与后端对接：页面与工具后端（app.js）同源，直接 fetch('/api/kill')。
      //   POST /api/kill  body: { mode: "port"|"pid", value: number }
      //   成功 → { ok:true, message:"已成功关闭：xxx（PID n）", killed:[{pid,name}] }
      //   失败 → { ok:false, error:"可读的中文错误" }
      // =====================================================================
      (function () {
        "use strict";

        const $ = (id) => document.getElementById(id);
        const state = { mode: "port", busy: false };

        const els = {
          modeBtns: document.querySelectorAll(".mode-switch button"),
          value: $("value"),
          btnKill: $("btn-kill"),
          hint: $("hint"),
          err: $("err"),
          result: $("result"),
          resultBadge: $("result-badge"),
          resultMsg: $("result-msg"),
          resultDetail: $("result-detail"),
          log: $("log"),
          logEmpty: $("log-empty"),
          btnClear: $("btn-clear"),
          toast: $("toast"),
        };

        // 两种模式的占位符与说明
        const MODE_INFO = {
          port: {
            placeholder: "例如 8080",
            hint: "输入被占用的端口号（1-65535），将反查占用该端口的进程并强制关闭（含其子进程树）。",
          },
          pid: {
            placeholder: "例如 1234",
            hint: "输入进程 PID（正整数），将校验存在后直接强制关闭该进程（含其子进程树）。",
          },
        };

        // ---------- 模式切换 ----------
        function setMode(mode) {
          state.mode = mode;
          els.modeBtns.forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
          els.value.placeholder = MODE_INFO[mode].placeholder;
          els.hint.textContent = MODE_INFO[mode].hint;
          els.value.value = "";
          hideError();
          hideResult();
          els.value.focus();
        }

        els.modeBtns.forEach((b) =>
          b.addEventListener("click", () => setMode(b.dataset.mode)),
        );

        // ---------- 输入校验（与后端一致） ----------
        function validate() {
          const raw = els.value.value.trim();
          if (!raw) return "请先输入" + (state.mode === "port" ? "端口号" : "PID");
          const n = Number(raw);
          if (state.mode === "port") {
            if (!Number.isInteger(n) || n < 1 || n > 65535) {
              return "端口号必须为 1-65535 之间的整数";
            }
          } else if (!Number.isInteger(n) || n < 1) {
            return "PID 必须为正整数";
          }
          return null;
        }

        // ---------- 提交关闭 ----------
        async function submit() {
          if (state.busy) return;

          const errMsg = validate();
          if (errMsg) {
            showError(errMsg);
            return;
          }

          const input = Number(els.value.value.trim());
          const what =
            state.mode === "port" ? `占用端口 ${input} 的进程` : `进程 PID ${input}`;
          if (!confirm(`确定要强制关闭${what}吗？该操作不可撤销。`)) return;

          state.busy = true;
          els.btnKill.disabled = true;
          els.btnKill.textContent = "正在关闭…";
          hideError();
          hideResult();

          try {
            const resp = await fetch("/api/kill", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ mode: state.mode, value: input }),
            });
            let data = null;
            try { data = await resp.json(); } catch { data = null; }
            if (!resp.ok || !data || data.ok !== true) {
              throw new Error((data && data.error) || `HTTP ${resp.status}`);
            }
            // 成功：展示应用名与 PID 明细
            renderResult(true, data.message, data.killed || [], data.partial);
            addLog(data.message, true);
          } catch (e) {
            const msg =
              e instanceof TypeError ? "无法连接工具后端（请确认工具正在运行）" : e.message;
            renderResult(false, msg, [], false);
            addLog(msg, false);
          } finally {
            state.busy = false;
            els.btnKill.disabled = false;
            els.btnKill.textContent = "立即关闭";
          }
        }

        els.btnKill.addEventListener("click", submit);
        els.value.addEventListener("keydown", (e) => {
          if (e.key === "Enter") submit();
        });

        // ---------- 结果渲染 ----------
        function renderResult(ok, msg, killed, partial) {
          els.result.classList.remove("hidden");
          const badge = els.resultBadge;
          badge.className = "badge " + (ok ? (partial ? "warn" : "success") : "error");
          badge.textContent = ok ? (partial ? "部分成功" : "关闭成功") : "关闭失败";
          els.resultMsg.textContent = msg;

          if (killed.length) {
            els.resultDetail.classList.remove("hidden");
            els.resultDetail.textContent =
              killed.map((k) => `应用：${k.name}    PID：${k.pid}`).join("\n");
          } else {
            els.resultDetail.classList.add("hidden");
          }
        }

        function hideResult() {
          els.result.classList.add("hidden");
          els.resultDetail.classList.add("hidden");
        }

        function showError(msg) {
          els.err.textContent = msg;
          els.err.classList.remove("hidden");
        }

        function hideError() {
          els.err.classList.add("hidden");
        }

        // ---------- 操作记录 ----------
        function addLog(msg, ok) {
          const li = document.createElement("li");
          const mark = document.createElement("span");
          mark.className = "log-mark " + (ok ? "ok" : "fail");
          mark.textContent = ok ? "✓" : "✗";

          const time = document.createElement("span");
          time.className = "log-time";
          const d = new Date();
          const p = (n) => String(n).padStart(2, "0");
          time.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

          const text = document.createElement("span");
          text.textContent = msg;

          li.append(mark, time, text);
          els.log.prepend(li);
          els.log.classList.remove("hidden");
          els.logEmpty.classList.add("hidden");
        }

        els.btnClear.addEventListener("click", () => {
          els.log.innerHTML = "";
          els.log.classList.add("hidden");
          els.logEmpty.classList.remove("hidden");
        });

        // ---------- 轻提示 ----------
        function toast(msg, isError) {
          els.toast.textContent = msg;
          els.toast.className = "toast" + (isError ? " error" : "");
          clearTimeout(els.toast._t);
          els.toast._t = setTimeout(() => els.toast.classList.add("hidden"), 2200);
        }

        // 初始化为端口模式
        setMode("port");
      })();
    </script>
  </body>
</html>
